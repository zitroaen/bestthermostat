name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(jq -r .version custom_components/bestthermostat/manifest.json)
          test "$TAG" = "$MANIFEST" || { echo "Tag $TAG != manifest $MANIFEST"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Package
        run: |
          cd custom_components/bestthermostat
          zip -r ../../bestthermostat.zip . -x '__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bestthermostat.zip
            custom_components/bestthermostat/frontend/bestthermostat-card.js
