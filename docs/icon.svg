<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB547"/>
      <stop offset="0.55" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#E8414A"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7EC8FF"/>
      <stop offset="0.5" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3B0"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1D6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7A1E10" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bg)"/>
  <!-- tick marks (24h dial) -->
  <g stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="10" stroke-linecap="round">
    <line x1="256" y1="52" x2="256" y2="72"/>
    <line x1="460" y1="256" x2="440" y2="256"/>
    <line x1="52" y1="256" x2="72" y2="256"/>
    <line x1="256" y1="460" x2="256" y2="440"/>
  </g>
  <!-- dial ring -->
  <circle cx="256" cy="256" r="152" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="30"/>
  <path d="M 148.5 363.5 A 152 152 0 1 1 363.5 363.5" fill="none" stroke="url(#arc)" stroke-width="30" stroke-linecap="round" filter="url(#sh)"/>
  <!-- knob -->
  <circle cx="363.5" cy="148.5" r="26" fill="#FFFFFF" filter="url(#sh)"/>
  <circle cx="363.5" cy="148.5" r="11" fill="#FF7A3D"/>
  <!-- flame -->
  <path filter="url(#sh)" fill="url(#flame)" d="M256 156 C 262 196 318 218 318 282 C 318 322 290 350 256 350 C 222 350 194 322 194 284 C 194 252 212 232 226 218 C 228 240 238 252 250 256 C 244 222 246 188 256 156 Z"/>
  <path fill="#FF8A3D" d="M258 254 C 262 276 288 286 288 312 C 288 332 274 344 256 344 C 238 344 224 332 224 314 C 224 298 234 288 242 282 C 244 294 250 300 256 302 C 252 286 252 270 258 254 Z"/>
</svg>
