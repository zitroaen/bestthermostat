<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Best Thermostat – card demo</title>
    <link rel="stylesheet" href="/frontend/node_modules/@mdi/font/css/materialdesignicons.min.css" />
    <style>
      :root {
        --primary-color: #03a9f4;
        --primary-text-color: #1c1c1e;
        --secondary-text-color: #6b6f76;
        --text-primary-color: #fff;
        --primary-background-color: #f2f3f5;
        --secondary-background-color: #eceef1;
        --card-background-color: #fff;
        --divider-color: rgba(0, 0, 0, 0.12);
        --disabled-color: #bdbdbd;
        --error-color: #db4437;
        --warning-color: #ffa600;
        --success-color: #43a047;
        --state-climate-heat-color: #ff8100;
        --ha-card-border-radius: 16px;
      }
      html.dark {
        --primary-text-color: #e6e6e6;
        --secondary-text-color: #9a9da3;
        --primary-background-color: #111315;
        --secondary-background-color: #25282c;
        --card-background-color: #1c1e21;
        --divider-color: rgba(255, 255, 255, 0.14);
      }
      body {
        margin: 0;
        padding: 16px;
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-family: Roboto, "Segoe UI", system-ui, sans-serif;
      }
      #stage {
        display: grid;
        gap: 16px;
        max-width: 1100px;
        margin: 0 auto;
      }
      #stage.two {
        grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
        align-items: start;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
